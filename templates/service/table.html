<div class="table-scroll" role="region" aria-label="Таблица данных, прокручивается по горизонтали" tabindex="0">
  <table>
    <thead>
      <tr>{% for name, label in columns %}<th scope="col">{{ label }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in rows %}<tr data-href="{{ row.url }}">
        {% for value in row.values %}<td>{% if forloop.first %}<a href="{{ row.url }}">{{ value|default_if_none:'—'
            }}</a>{% else %}{{ value|default_if_none:'—' }}{% endif %}</td>{% endfor %}
      </tr>{% empty %}<tr>
        <td colspan="{{ columns|length }}" class="empty">Записей не найдено.</td>
      </tr>{% endfor %}
    </tbody>
  </table>
</div>
