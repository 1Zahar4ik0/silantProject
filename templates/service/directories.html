{% extends 'base.html' %}
{% block content %}
<div class="section-heading">
    <h1>Справочники</h1><a class="button" href="{% url 'directory_add' %}">+ Добавить запись</a>
</div>
<div class="panel table-scroll">
    <table>
        <thead>
            <tr>
                <th>Справочник</th>
                <th>Название</th>
                <th>Описание</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}<tr data-href="{% url 'directory_edit' item.pk %}">
                <td>{{ item.get_kind_display }}</td>
                <td><a href="{% url 'directory_edit' item.pk %}">{{ item.name }}</a></td>
                <td>{{ item.description }}</td>
            </tr>{% empty %}<tr>
                <td colspan="3">Справочники пока не заполнены.</td>
            </tr>{% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
