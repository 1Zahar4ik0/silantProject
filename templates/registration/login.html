{% extends 'base.html' %}
{% block content %}
<section class="login panel"><span class="eyebrow">МОЙ СИЛАНТ</span>
    <h1>Вход в систему</h1>
    <p class="muted">Введите логин и пароль, полученные от администратора.</p>
    <form method="post">{% csrf_token %}{{ form.non_field_errors }}
        {% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
        <input type="hidden" name="next" value="{{ next }}"><button type="submit">Войти</button>
    </form>
    <a class="back" href="{% url 'home' %}">← Поиск без авторизации</a>
</section>
{% endblock %}
